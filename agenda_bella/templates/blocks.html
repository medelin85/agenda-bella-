{% extends 'base.html' %}{% block content %}<h1>Reservar intervalo</h1><p>Bloqueie um período para deslocamento ou indisponibilidade.</p><form method="post" class="card" {% if error %}aria-describedby="form-error"{% endif %}><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% for field,label,kind in [('start','Início','datetime-local'),('end','Término','datetime-local'),('reason','Motivo','text')] %}<label for="{{ field }}">{{ label }} (obrigatório)</label><input id="{{ field }}" name="{{ field }}" type="{{ kind }}" required maxlength="100" value="{{ request.form.get(field,'') }}">{% endfor %}<button>Reservar intervalo</button></form>{% endblock %}
