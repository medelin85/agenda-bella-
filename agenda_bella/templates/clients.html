{% extends 'base.html' %}{% block content %}<h1>Clientes</h1><form method="post" class="card" {% if error %}aria-describedby="form-error"{% endif %}><h2>Cadastrar cliente</h2><p>Todos os campos são obrigatórios.</p><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="name">Nome</label><input id="name" name="name" required maxlength="150" value="{{ request.form.get('name','') }}" autocomplete="name"><label for="phone">Telefone</label><input id="phone" name="phone" type="tel" required maxlength="25" value="{{ request.form.get('phone','') }}" autocomplete="tel"><button>Salvar cliente</button></form><form method="get" class="card"><label for="q">Pesquisar por nome ou telefone</label><input id="q" name="q" value="{{ q }}" maxlength="150"><button>Pesquisar</button></form><ul class="results">{% for item in rows %}<li class="card"><strong>{{ item.name }}</strong><p>{{ item.phone }}</p></li>{% else %}<li>Nenhuma cliente encontrada.</li>{% endfor %}</ul>{% endblock %}
